# Test configuration: In-memory H2 database for test isolation
spring.datasource.url=jdbc:h2:mem:upimeshtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# In-memory / temporary test keys directory
upi.mesh.key-dir=./target/test-keys
upi.mesh.idempotency-ttl-seconds=86400
upi.mesh.packet-max-age-seconds=86400
